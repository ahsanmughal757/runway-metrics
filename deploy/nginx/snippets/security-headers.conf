# Response headers for the document.
#
# Included at `server` level and again inside every location that adds a header of
# its own. That repetition is not an oversight, and deleting it is the single
# easiest way to silently remove every header in this file: nginx inherits
# `add_header` from the enclosing level *only when the current level declares none
# of its own*. One `add_header Cache-Control` in a location and the CSP, HSTS and
# nosniff that the server level set stop applying to that location, with no
# warning anywhere.
#
# Indentation: 4 spaces, matching default.conf.

# --- Content-Security-Policy ----------------------------------------------
#
# `backend/src/main.ts:36` turns helmet's CSP off with the note that nginx owns
# the document policy. This is that policy, written against what the real build
# does — Vite's output is one module script and one stylesheet, both under
# /assets/ (`frontend/dist/index.html`), plus the one external dependency, Google
# Fonts in `frontend/index.html` — rather than against a tutorial.
#
# This is one long string on one line on purpose. nginx's `add_header` is a two
# argument keyval slot: it does *not* concatenate adjacent quoted values the way
# a reader expects, so splitting a CSP across `"a" "b" "c"` fails with "invalid
# number of arguments" and takes the whole config down. Newlines inside the
# quotes are not an option either.
#
# default-src 'none' first, then an explicit allowlist, so that a directive
# nobody has thought about yet fails closed instead of open.
#
# base-uri 'none' rather than 'self': nothing renders a <base> tag, and 'self'
#   would still let an injected <base> rewrite every relative URL on the page.
# object-src 'none': no plugins, and this is the classic <object data=...>
#   exfiltration route.
# frame-ancestors 'none': clickjacking. Paired with X-Frame-Options below for the
#   browsers that predate it.
# form-action 'self': the app has no HTML forms, so this is pure defence against
#   an injected one posting a session somewhere else.
#
# script-src 'self' — no 'unsafe-eval', no 'unsafe-inline'. The built document has
#   one external module script and no inline script, and route-level code
#   splitting uses dynamic import(), which script-src covers for same-origin.
#   'unsafe-eval' is a dev-server requirement only: if this config is ever pointed
#   at `vite dev`, that is the one token to change, and doing it for a production
#   build trades the main XSS defence for nothing.
#
# style-src — strict, no 'unsafe-inline'. The only external stylesheet is Google's
#   CSS and the app's own is a hashed file under /assets/.
# style-src-attr 'unsafe-inline' — the one genuinely permissive token in this
#   policy, and it is needed: around a dozen components set style={...} directly
#   (box-shadow in the toast and the command palette, SVG fill and left:%
#   percentages in the charts, Skeleton height), and framer-motion writes
#   transform/opacity the same way. This is the narrowest form that works —
#   inline style *attributes* are allowed, while inline <style> elements and
#   injected stylesheets stay blocked. It is also the token I am least certain
#   about: a browser without style-src-attr (Safari < 15.4) falls back to
#   style-src and would silently drop those styles, degrading box-shadows and
#   chart positions rather than breaking the app. Widening style-src itself to
#   'unsafe-inline' would fix that and hand back the ability to inject arbitrary
#   CSS, which is the worse trade.
#
# font-src 'self' https://fonts.gstatic.com — gstatic is where the woff2 files
#   actually come from; Google serves them without CORP, which is also why COEP is
#   off below. Rejected: self-hosting the two families. That is the strictly
#   correct answer and it removes an external dependency from the critical
#   rendering path, but it means editing frontend/index.html, which this file
#   does not own.
#
# img-src 'self' data: — nothing in frontend/src renders an <img> today. 'self' is
#   here so the browser's implicit /favicon.ico request is not a console
#   violation, and 'data:' costs nothing.
#
# connect-src 'self' — the API client uses the relative base `/api`
#   (frontend/src/lib/api.ts:15), so same-origin covers every fetch. The one
#   caveat: lib/errorReporting.ts posts to import.meta.env.VITE_ERROR_REPORTING_URL
#   via navigator.sendBeacon, and beacon is governed by connect-src. If that is
#   ever pointed at a third-party origin, add it here or client errors stop
#   arriving, with no visible symptom on the client.
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

# --- Other document headers ------------------------------------------------

# helmet already sets this on API responses; the document and the hashed assets
# were uncovered until now. Together with `try_files ... =404` on /assets/ it is
# what turns a stale asset request into a hard failure rather than a silently
# mis-typed script.
add_header X-Content-Type-Options "nosniff" always;

# Superseded by frame-ancestors in any browser that supports CSP, kept for the ones
# that do not. DENY rather than SAMEORIGIN: nothing here is legitimately embedded,
# including by ourselves.
add_header X-Frame-Options "DENY" always;

# strict-origin-when-cross-origin rather than no-referrer, and this is a
# deliberate loss of privacy in exchange for one thing: /share/:token is a public
# URL with a token in its path, and no-referrer would strip the Referer from
# internal navigation too. Cross-origin requests still leave with only the origin,
# so the token never reaches a third party. SameSite=Lax on the refresh cookie is
# the other half of that reasoning.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# One year, and deliberately *not* preloaded.
#
# max-age: 31536000 is the year browsers require for preload eligibility, and it is
# also the point of no return in practice — once a browser has cached HSTS it
# refuses plain HTTP for that host until the max-age expires, and you cannot talk a
# user past it. So on a first deployment, start at max-age=300, confirm the
# certificate chain is complete (a missing intermediate shows up as a browser
# warning, and with HSTS cached that warning cannot be clicked through), then raise
# it. Do the ramp before a migration rather than during one.
#
# Rejected: preload + includeSubDomains. Preload is close to irreversible —
# removal from the list takes months — and it commits every subdomain of the domain
# to HTTPS, including ones that do not exist yet. It is a decision about the whole
# domain, not about this deployment, and it is not reversible on a timescale anyone
# can plan around.
add_header Strict-Transport-Security "max-age=31536000" always;

# The app uses no camera, microphone, geolocation or payments, and /devices lists
# sessions rather than registering WebAuthn credentials. Sending this now means a
# future feature that needs one is a visible change here instead of a silent grant.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

# COOP isolates this document from any window that opens it, which is the cheap
# half of tabnabbing defence. The other half — COEP require-corp — is deliberately
# absent: it would block the Google Fonts stylesheet and woff2 files, because
# fonts.gstatic.com sends no CORP header. Enabling COEP is therefore coupled to
# self-hosting the fonts, not to a config change here.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CORP same-origin: these assets are same-origin only, and a response carrying
# nosniff plus this cannot be pulled into another origin's page.
add_header Cross-Origin-Resource-Policy "same-origin" always;

# The legacy auditor is a XSS *vector* in some engines and has been removed from
# the others; disabling it is the current recommendation, not a regression.
# Helmet does the same on the API side.
add_header X-XSS-Protection "0" always;

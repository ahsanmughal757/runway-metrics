# Proxy headers and timeouts for the `/api/` location in default.conf.
#
# Kept as a snippet so the header block and the location body stay separately
# readable; it is included inside `location ^~ /api/`, so everything here must be
# valid in a location context.
#
# Indentation: 4 spaces, matching default.conf.

# 1.1 so the upstream keepalive pool above is actually used. Without it nginx
# speaks HTTP/1.0 to the upstream and opens a socket per request, which is the
# whole reason the `keepalive 16` directive exists.
proxy_http_version 1.1;

# Clearing Connection is what lets the request be eligible for keepalive. With
# the default `Connection: close` nginx still uses the upstream block, just
# without the reuse.
proxy_set_header Connection "";

proxy_set_header Host $host;

proxy_set_header X-Real-IP $remote_addr;

proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# $scheme, not a literal "https", and not the client's own X-Forwarded-Proto.
# nginx terminates TLS, so from the API's side the request arrived over http and
# the scheme it must record is https. $host is used rather than $http_host so the
# forwarded host never carries a port.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Does the API actually depend on X-Forwarded-Proto today? Not for the cookie:
# `refresh-cookie.ts:25` sets `secure: isProduction || env.COOKIE_SECURE`, a
# constant, and `env.ts` refuses to boot in production without COOKIE_SECURE=true
# — so the refresh cookie is marked Secure regardless of what this header says.
# That constant is also why a wrong proto here would *not* show up as a login
# loop; it would show up as something quieter.
#
# What does depend on it is everything that reads req.protocol or req.ip:
# the current IP attribution for every request is nginx's container address,
# not the client's, and every log line that resolves the client from it is wrong.
#
# Which is the honest caveat: there is no `trust proxy` setting in the backend
# yet — `rg -n "trust proxy" backend/src` finds only the comment in main.ts about
# being behind a reverse proxy. Express ignores X-Forwarded-* entirely unless
# trust proxy is set, so today this header is recorded but unread. The plan's
# 6-4 item is to set it to match the real hop count; with exactly this topology
# — browser -> nginx -> api, nginx being the only thing in front — the correct
# value is `1`. A larger number would let a client forge its own X-Forwarded-For
# and choose the IP the API logs, so 1 is the ceiling here, not a starting point.

# Timeouts, ordered against the client's own: frontend/src/lib/api.ts sets
# REQUEST_TIMEOUT_MS to 20s, so the read timeout below must stay above it or
# nginx hangs up mid-response while the browser is still waiting, which surfaces
# as an unexplained network error instead of the app's own timeout message.
# 60s is comfortably clear of that and of a cold cohort query, while still
# bounding how long a wedged API holds a connection open.
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

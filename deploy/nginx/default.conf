# Runway — nginx front door for the SPA and the API.
#
# Indentation is 4 spaces throughout this file and in every snippet it includes.
# Nginx is whitespace-insensitive, so this is purely a readability choice; it is
# stated here because a mixed file is miserable to review in a diff.
#
# Mounted at /etc/nginx/conf.d/default.conf. `conf.d` is included from *inside*
# the `http` block, which is why http-level directives (upstream, gzip) are legal
# at the top of this file. Snippets mount to /etc/nginx/snippets/.
#
# This file is the whole of the document security posture. `backend/src/main.ts:36`
# disables helmet's contentSecurityPolicy with the rationale that "the API serves
# JSON only; the SPA is served by nginx, which owns the document CSP". That
# promise is kept here and nowhere else in the repository, so treat this file as
# load-bearing rather than as deployment boilerplate.

upstream runway_api {
    # Compose service name + the API's default port (`env.ts:94`, PORT defaults to
    # 4000). Resolvable on the compose network and nowhere else: the `api` service
    # must not publish a host port, or this file's isolation is undone by a
    # `ports:` entry in docker-compose.yml.
    server api:4000;

    keepalive 16;
}

# --------------------------------------------------------------------------
# Compression
# --------------------------------------------------------------------------

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;

# `gzip_types` extends nginx's built-in list rather than replacing it, so the
# defaults are already covered and text/html is deliberately absent below —
# restating it produces `[warn] duplicate MIME type "text/html"` from nginx -t,
# which is exactly the kind of noise that trains an operator to ignore -t output.
# Verified, not assumed: the warning only appears if text/html is already in the
# effective set.
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/csv
    text/javascript
    text/plain
    text/xml;

# Brotli is the better compressor for this payload — ~15-20% smaller on JS, CSS and
# HTML because its static dictionary is trained on web text, and that is exactly
# what this build ships (~40 hashed chunks under frontend/dist/assets). It is not
# enabled because ngx_brotli is not compiled into the stock nginx image, and an
# unknown directive is a *startup failure*, not a warning: `nginx -t` aborts with
# "unknown directive brotli" and the container never serves anything.
#
# To turn it on, move the `web` service to an image that ships the module
# (nginxinc/nginx-unprivileged does) and uncomment below. Keep the gzip block
# above as well: brotli is a negotiator in addition to gzip, not a replacement,
# and a small minority of clients send Accept-Encoding without br.
#
# brotli on;
# brotli_comp_level 5;
# brotli_min_length 512;
# brotli_types
#     application/javascript
#     application/json
#     application/manifest+json
#     application/wasm
#     application/xml
#     image/svg+xml
#     text/css
#     text/csv
#     text/html
#     text/javascript
#     text/plain
#     text/xml;

# --------------------------------------------------------------------------
# Plain HTTP: ACME, then redirect
# --------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name runway.example.com;

    # Certbot's http-01 challenge has to be answerable over plain HTTP, before any
    # redirect exists, otherwise a first-time renewal cannot renew.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        # $server_name, not $host. $host is the client's own Host header, and
        # putting it in a redirect target is a textbook open redirect: a request
        # with `Host: attacker.example` gets a 301 pointing at the attacker. This
        # config is trusted input, so it is safe here.
        #
        # 301 over 308: every request that reaches this block is a navigation to
        # the HTTPS document, and browsers cache 301 aggressively, which is what
        # you want for "the app is at https now". Use 308 instead if you ever need
        # the method and body preserved — note that a POST replayed as a GET
        # after a 301 fails in a way that is hard to diagnose, so if plain-HTTP
        # API calls ever become reachable, that is the flag to change.
        return 301 https://$server_name$request_uri;
    }
}

# --------------------------------------------------------------------------
# TLS: the document
# --------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # The 1.25.1+ spelling of HTTP/2. Images older than that only understand
    # `listen 443 ssl http2;` and will refuse to start on this line, so if nginx
    # is ever pinned backwards, move the keyword back onto the listen directive
    # rather than deleting it — browsers still negotiate h2 via ALPN.
    http2 on;

    server_name runway.example.com;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.0/1.1 are removed rather than merely deprioritised: both are broken
    # and nothing on the client side benefits from keeping them reachable.
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Off, not on (the default). Session tickets are server-side state whose
    # confidentiality and rotation are harder to reason about than a full
    # handshake, and resumption buys little here — index.html is a few kB and the
    # hashed assets are immutable. Prefer forward secrecy to a faster handshake.
    ssl_session_tickets off;

    # Inherited by every location below *unless* that location declares its own
    # add_header. See the note above `location ^~ /assets/`: any location that
    # adds a header of its own must re-include this snippet, or it silently
    # inherits nothing.
    include /etc/nginx/snippets/security-headers.conf;

    # --- Hashed build output ---------------------------------------------

    # ^~ so a regex location elsewhere can never take precedence over it, and
    # `try_files ... =404` so a missing chunk is a 404 rather than an HTML
    # document. That second part is not defensive programming for its own sake:
    # the SPA fallback below would otherwise answer a stale asset request with
    # index.html, the browser would receive HTML under a .js path, and
    # `X-Content-Type-Options: nosniff` would correctly refuse to execute it —
    # turning a routine deploy (where old HTML outlives old chunks) into a blank
    # page with no error message.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;

        # No `always` here, and the omission is deliberate: `always` extends the
        # header to 4xx and 5xx, so a chunk that 404s in the seconds between "new
        # index.html is live" and "old chunks are gone" would be cached immutable
        # for a year — the browser would keep asking for a file nginx has already
        # promised it will never serve again. Without it the header applies to 2xx
        # and 3xx only, which is what immutable actually means.
        add_header Cache-Control "public, max-age=31536000, immutable";

        try_files $uri =404;

        # ~40 files per page load, none of them useful in an incident timeline.
        access_log off;
    }

    # --- The API ---------------------------------------------------------

    # `/api` with no trailing slash is not matched by `location ^~ /api/`, so
    # without this exact-match block it falls through to the SPA fallback and
    # answers a JSON path with a 200 HTML document — a confusing failure to debug
    # from either side. 308 rather than 301 so the method survives the redirect.
    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        # Not "no-store": that forbids storing the response at all and forces a
        # full download on every call. API JSON is per-user and per-company, so
        # the risk is a shared cache or a browser replay serving somebody else's
        # metrics; "private" is the honest instruction — it may be stored by the
        # user agent only, and no shared cache may reuse it.
        add_header Cache-Control "private, no-store" always;
        add_header Pragma "no-cache" always;

        include /etc/nginx/snippets/api-proxy.conf;

        # No trailing slash and no URI part. `proxy_pass http://runway_api/;`
        # would replace the matched `/api/` prefix with `/`, and every request
        # would arrive at the backend as `/companies` and 404.
        proxy_pass http://runway_api;
    }

    # --- Health probes ---------------------------------------------------

    # The API exposes /health and /health/ready *outside* the /api prefix
    # (`main.ts:74` excludes them from the global prefix). They are for the
    # compose healthcheck, which reaches `api:4000` directly on the compose
    # network, so they are deliberately not proxied here: an unauthenticated
    # readiness endpoint on the public internet is a free "is the database up"
    # oracle, and readiness does a live `SELECT 1`.
    #
    # These must still be excluded from the SPA fallback. Without an explicit
    # block, `location /` answers them with 200 and an HTML body, which is the
    # worst possible outcome for an uptime monitor: permanently green, whether or
    # not the application is alive. A hard 404 fails loudly instead.
    location = /health {
        return 404;
    }

    location = /health/ready {
        return 404;
    }

    # The browser asks for this unprompted on every visit. Answering it from the
    # SPA fallback returns index.html with a 200, which is harmless but fills the
    # access log with a lie.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # --- The SPA ---------------------------------------------------------

    # The fallback. Everything not matched above lands here, which is the point:
    # react-router owns the route table, so nginx must not try to mirror it. Every
    # deep link (`/metrics`, `/devices`, `/cohorts`, …) is a 404 as a *file* and a
    # rendered page as a *route*, and `App.tsx:142` renders the NotFound page for
    # anything it does not recognise. Duplicating the route list here to return a
    # real 404 for typos would mean two lists that drift, and would break the
    # client-side 404 route that already exists.
    location / {
        include /etc/nginx/snippets/security-headers.conf;

        # Deliberately revalidating rather than uncached. A stored index.html is
        # only ever correct if it is checked: the reason `no-store` is tempting
        # is that it reads as "cannot be cached", when what is actually wanted is
        # "can never be *stale*". `no-cache, must-revalidate` gives exactly that —
        # the browser may store it and gets a 304 against the ETag on every hard
        # refresh, which is a few hundred bytes instead of a full document.
        #
        # This asymmetry with /assets/ is the whole reason a deploy does not take
        # the site down: index.html names hashed filenames, and the moment a new
        # build replaces them, a cached copy of the old document points at chunks
        # that have been deleted — every asset request 404s and the app is a blank
        # page for anyone holding the stale copy. Hashed assets can be cached
        # forever precisely because their names change when their contents do.
        add_header Cache-Control "no-cache, must-revalidate" always;

        # The query string is carried through the fallback, so /scenarios?tab=x
        # and the share-link paths resolve the same way they would client-side.
        try_files $uri $uri/ /index.html;
    }
}

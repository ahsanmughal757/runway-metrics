packages:
  - backend
  - frontend

# pnpm only reads build-approval settings from the workspace root, so these
# merged lists (from the former per-package pnpm-workspace.yaml files) live here.
allowBuilds:
  '@heroui/shared-utils': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
